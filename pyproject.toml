[project]
name = "promise-tracker-nyc"
version = "0.1.0"
description = "Deep research agent that checks NYC officials' 2025 campaign promises against archived pages, Council records, NYC Open Data, city spending and news"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "openai-agents[litellm]>=0.22",
    "google-cloud-aiplatform>=1.40.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "duckdb>=1.5.6",
    "beautifulsoup4>=4.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
# Tests import app.py and sources/ from the project root.
pythonpath = ["."]
testpaths = ["tests"]
